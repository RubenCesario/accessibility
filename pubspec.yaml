name: accessibility_workspace
description: Workspace of the accessibility package family. Not published.
publish_to: none

environment:
  sdk: ^3.12.0

workspace:
  - packages/accessibility
  - packages/accessibility_testing
  - packages/flutter_accessibility
  - packages/accessibility_localizations
  - packages/accessibility_shared_preferences
  - packages/accessibility_font_andika
  - packages/accessibility_material
  - packages/accessibility_cupertino
  - examples/material
  - examples/cupertino
  - examples/custom_ui

dev_dependencies:
  melos: ^7.0.0

melos:
  scripts:
    analyze:
      description: Analyze every package with infos and warnings as errors.
      run: melos exec -c 1 -- dart analyze --fatal-infos --fatal-warnings .
    format:
      description: Fail when any package is not formatted.
      run: melos exec -c 1 -- dart format --set-exit-if-changed .
    gen-l10n:
      description: Regenerate the localizations and strip the Material delegates.
      run: melos exec --scope=accessibility_localizations -- flutter gen-l10n --arb-dir lib/l10n --template-arb-file app_en.arb --output-dir lib/src/generated --output-localization-file accessibility_localizations.dart --output-class AccessibilityLocalizations --no-nullable-getter --use-deferred-loading --untranslated-messages-file untranslated_messages.json --format && melos exec --scope=accessibility_localizations -- dart ../../tool/strip_l10n_delegates.dart lib/src/generated/accessibility_localizations.dart && melos exec --scope=accessibility_localizations -- dart format lib/src/generated
    test:
      description: Run the tests of every package that has a test directory.
      run: melos run test:dart --no-select && melos run test:flutter --no-select
    test:dart:
      description: Run the tests of the pure Dart packages.
      run: melos exec -c 1 --no-flutter --dir-exists=test -- dart test
    test:flutter:
      description: Run the tests of the Flutter packages.
      run: melos exec -c 1 --flutter --dir-exists=test -- flutter test
    test:coverage:
      description: Run the tests of every package with coverage output.
      run: melos run test:coverage:dart --no-select && melos run test:coverage:flutter --no-select
    test:coverage:dart:
      description: Run the pure Dart tests with coverage output.
      run: melos exec -c 1 --no-flutter --dir-exists=test -- dart run coverage:test_with_coverage
    test:coverage:flutter:
      description: Run the Flutter tests with coverage output.
      run: melos exec -c 1 --flutter --dir-exists=test -- flutter test --coverage
    coverage:check:
      description: Fail when a gated package is below 100% line coverage.
      run: melos exec -c 1 --scope=accessibility --scope=accessibility_testing --scope=flutter_accessibility --scope=accessibility_shared_preferences -- dart ../../tool/check_coverage.dart coverage/lcov.info 100
