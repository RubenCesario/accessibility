name: build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - master
      - release/2.0

permissions:
  contents: read

jobs:
  packages:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: accessibility
            coverage_gate: 100
            pana: true
            test_command: dart run coverage:test_with_coverage
          - package: accessibility_testing
            coverage_gate: 100
            # Depends on the unpublished 2.0.0 core until the release.
            pana: false
            test_command: dart run coverage:test_with_coverage
          - package: flutter_accessibility
            coverage_gate: 100
            # Depends on the unpublished 2.0.0 core until the release.
            pana: false
            test_command: flutter test --coverage
          - package: accessibility_localizations
            coverage_gate: 0
            # pana verifies the repository URL against master, which has no
            # pubspec named accessibility_localizations until plan 6 lands.
            pana: false
            test_command: flutter test --coverage
          - package: accessibility_shared_preferences
            coverage_gate: 100
            # Depends on the unpublished 2.0.0 core until the release.
            pana: false
            test_command: flutter test --coverage
          - package: accessibility_font_andika
            coverage_gate: 0
            # Depends on the unpublished 2.0.0 core until the release.
            pana: false
            test_command: flutter test --coverage
          - package: accessibility_material
            coverage_gate: 0
            # Depends on the unpublished 2.0.0 core until the release.
            pana: false
            test_command: flutter test --coverage
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - name: 🐦 Checkout
        uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 📦 Resolving the workspace
        working-directory: .
        run: flutter pub get

      - name: ✨ Making sure the package is formatted
        run: dart format --set-exit-if-changed .

      - name: 🔍 Making sure that there are no analysis warnings or errors
        run: dart analyze --fatal-infos --fatal-warnings .

      - name: 🧪 Test with coverage
        run: ${{ matrix.test_command }}

      - name: 📊 Verify coverage
        if: ${{ matrix.coverage_gate > 0 }}
        run: dart ../../tool/check_coverage.dart coverage/lcov.info ${{ matrix.coverage_gate }}

      - name: ⬆️ Upload coverage
        if: ${{ matrix.coverage_gate > 0 }}
        uses: codecov/codecov-action@v5
        with:
          flags: ${{ matrix.package }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          files: packages/${{ matrix.package }}/coverage/lcov.info

      - name: 💯 Verify pub score
        if: ${{ matrix.pana }}
        run: |
          set -e
          dart pub global activate pana
          copy=$(mktemp -d)/${{ matrix.package }}
          cp -r . "$copy"
          sed -i '/^resolution: workspace$/d' "$copy/pubspec.yaml"
          sed -i '/^  accessibility_testing:/d' "$copy/pubspec.yaml"
          rm -f "$copy/analysis_options.yaml"
          pana --no-warning --exit-code-threshold 0 "$copy"

  tooling:
    name: workspace tooling
    runs-on: ubuntu-latest
    steps:
      - name: 🐦 Checkout
        uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 📦 Resolving the workspace
        run: flutter pub get

      - name: ✨ Making sure the tooling is formatted
        run: dart format --set-exit-if-changed tool

      - name: 🔍 Analyzing the tooling
        run: dart analyze --fatal-infos --fatal-warnings tool
